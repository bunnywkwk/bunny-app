<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Workspace Bunny</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #0f172a; color: white; font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center py-12">
    <div class="w-full max-w-2xl bg-white/10 backdrop-blur-lg border border-white/20 rounded-3xl p-8 shadow-2xl">
        <h1 class="text-4xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-purple-400 to-pink-600 mb-2 text-center">
            Workspace Bunny
        </h1>
        <p class="text-center text-white/60 mb-8 text-sm">Monolith Architecture Demo</p>
        
        <form action="/add" method="POST" class="flex flex-col gap-4 mb-10">
            <input 
                type="text" 
                name="name"
                placeholder="Your Name" 
                class="bg-black/20 border border-white/10 rounded-xl px-4 py-3 focus:outline-none focus:ring-2 focus:ring-purple-500 transition-all text-white"
                required
            />
            <input 
                type="text" 
                name="message"
                placeholder="Secret Message" 
                class="bg-black/20 border border-white/10 rounded-xl px-4 py-3 focus:outline-none focus:ring-2 focus:ring-pink-500 transition-all text-white"
                required
            />
            <button type="submit" class="bg-gradient-to-r from-purple-500 to-pink-500 hover:from-purple-600 hover:to-pink-600 font-bold py-3 rounded-xl transition-all transform hover:scale-[1.02]">
                Store Record in Database
            </button>
        </form>

        <div class="space-y-4">
            <h2 class="text-xl font-semibold mb-4 text-white/80">Stored Records:</h2>
            {% if not records %}
                <p class="text-white/50 text-center italic">No records yet. The database is empty!</p>
            {% else %}
                {% for rec in records %}
                <div class="bg-white/5 border border-white/10 rounded-xl p-4 flex justify-between items-center">
                    <div class="flex flex-col">
                        <span class="font-bold text-purple-400">{{ rec.name }}</span>
                        <span class="text-white/80">{{ rec.message }}</span>
                    </div>
                    <form action="/delete/{{ rec.id }}" method="POST">
                        <button type="submit" class="bg-red-500/20 hover:bg-red-500/40 text-red-400 px-3 py-1 rounded-lg text-sm transition-all border border-red-500/30">
                            Delete
                        </button>
                    </form>
                </div>
                {% endfor %}
            {% endif %}
        </div>
    </div>
</body>
</html>
